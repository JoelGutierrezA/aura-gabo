<header class="site-header">
  <div class="site-header__inner">
    <a class="brand" routerLink="/" fragment="inicio" aria-label="Ir al inicio" (click)="closeMenu()">
      <span class="brand__mark" aria-hidden="true">AG</span>
      <span>Auraluminio</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      aria-label="Abrir menu"
      [attr.aria-expanded]="isMenuOpen()"
      aria-controls="primary-navigation"
      (click)="toggleMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      id="primary-navigation"
      class="site-nav"
      [class.site-nav--open]="isMenuOpen()"
      aria-label="Navegacion principal"
    >
      @for (item of navigationItems; track item.fragment) {
        <a routerLink="/" [fragment]="item.fragment" (click)="closeMenu()">{{ item.label }}</a>
      }
    </nav>

    <div class="header-social" aria-label="Redes sociales">
      <a href="https://www.instagram.com/" target="_blank" rel="noreferrer" aria-label="Instagram">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1"></circle>
        </svg>
      </a>
      <a href="https://www.facebook.com/" target="_blank" rel="noreferrer" aria-label="Facebook">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M14 8h3V4h-3c-3 0-5 2-5 5v2H6v4h3v5h4v-5h3l1-4h-4V9c0-.6.4-1 1-1Z"></path>
        </svg>
      </a>
      <a href="https://wa.me/56912345678" target="_blank" rel="noreferrer" aria-label="WhatsApp">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4.5 19.5 6 16.1A8 8 0 1 1 9 19l-4.5.5Z"></path>
          <path d="M9 9.5c.4 2.6 2.1 4.3 5 5l1.2-1.2c.3-.3.7-.4 1.1-.2l1.6.7"></path>
        </svg>
      </a>
    </div>
  </div>
</header>
