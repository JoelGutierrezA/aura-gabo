<section id="contacto" class="section contact-section" aria-labelledby="contact-title">
  <div class="contact container">
    <h2 id="contact-title" class="section-title">¿En qué te podemos ayudar? Conversemos.</h2>

    <form class="contact-form" [formGroup]="contactForm" (ngSubmit)="onSubmit()"
      [attr.aria-busy]="isSubmitting" novalidate>
      <fieldset class="contact-form__fields" [disabled]="isSubmitting">
        <label>
          <span>Nombre</span>
          <input type="text" formControlName="name" autocomplete="name" placeholder="Tu nombre">
          @if (hasError('name')) {
            <small>Ingresa al menos 2 caracteres.</small>
          }
        </label>

        <label>
          <span>Correo electronico</span>
          <input type="email" formControlName="email" autocomplete="email" placeholder="nombre@correo.com">
          @if (hasError('email')) {
            <small>Ingresa un correo valido.</small>
          }
        </label>

        <label>
          <span>Telefono</span>
          <input type="tel" formControlName="phone" autocomplete="tel" placeholder="+56 9 1234 5678">
          @if (hasError('phone')) {
            <small>Ingresa un telefono valido.</small>
          }
        </label>

        <label>
          <span>Mensaje</span>
          <textarea rows="5" formControlName="message" placeholder="Cuentanos brevemente que necesitas"></textarea>
          @if (hasError('message')) {
            <small>Ingresa un mensaje de al menos 10 caracteres.</small>
          }
        </label>

        <label class="contact-form__checkbox">
          <input type="checkbox" formControlName="acceptedPolicies">
          <span>
            Acepto las <a routerLink="/politicas-privacidad">politicas de privacidad</a>.
          </span>
        </label>
        @if (hasError('acceptedPolicies')) {
          <small>Debes aceptar las politicas para enviar el formulario.</small>
        }

      </fieldset>

      <button class="button button--primary" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Enviando…' : 'Enviar' }}
      </button>

      @if (submitSucceeded) {
        <p class="contact-form__status" role="status">Tu mensaje se envió correctamente. Te responderemos pronto.</p>
      }
      @if (submitError) {
        <p class="contact-form__status contact-form__status--error" role="alert">{{ submitError }}</p>
      }
    </form>
  </div>
</section>
