<section id="sobre" class="about" aria-label="Quienes Somos" aria-roledescription="carrusel"
  (keydown.arrowleft)="previous(); $event.preventDefault()"
  (keydown.arrowright)="next(); $event.preventDefault()">
  <div class="about__carousel">
    <div id="about-slides" class="about__slides" aria-live="polite" aria-atomic="true"
      (pointerdown)="startSwipe($event)" (pointerup)="endSwipe($event)" (pointercancel)="cancelSwipe()">
      @for (slide of slides; track slide.src) {
        <div class="about__slide" [class.about__slide--active]="activeIndex() === $index"
          [attr.aria-hidden]="activeIndex() !== $index" role="group" aria-roledescription="diapositiva"
          [attr.aria-label]="($index + 1) + ' de ' + slides.length">
          <img [src]="slide.src" [alt]="slide.alt" width="1500" height="1000" loading="lazy" draggable="false">
        </div>
      }
    </div>

    <button class="about__arrow about__arrow--previous" type="button" aria-label="Imagen anterior"
      aria-controls="about-slides" (click)="previous()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg>
    </button>
    <button class="about__arrow about__arrow--next" type="button" aria-label="Imagen siguiente"
      aria-controls="about-slides" (click)="next()">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg>
    </button>

    <div class="about__dots" role="group" aria-label="Seleccionar imagen">
      @for (slide of slides; track slide.src) {
        <button class="about__dot" type="button" [class.about__dot--active]="activeIndex() === $index"
          [attr.aria-label]="'Ver imagen ' + ($index + 1)" [attr.aria-current]="activeIndex() === $index ? 'true' : null"
          aria-controls="about-slides" (click)="activeIndex.set($index)"></button>
      }
    </div>
  </div>
</section>
